steps:
  check:
    image: denoland/deno:debian-2.9.5
    when:
      event: [push, pull_request, tag, manual]
    commands:
      - deno --version
      - deno install
      - deno task check
      - deno task test
      - deno task build

  release:
    image: denoland/deno:debian-2.9.5
    when:
      event: [tag]
      tag: v*
    commands:
      - deno install
      - deno task build
      - docker build -t antonshubin/mig:$${CI_COMMIT_TAG} -t antonshubin/mig:latest .
      - docker push antonshubin/mig:$${CI_COMMIT_TAG}
      - docker push antonshubin/mig:latest
    secrets: [docker_username, docker_password]
