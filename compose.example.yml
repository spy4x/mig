# Example docker-compose for local development or single-host deployment.
# Copy to compose.yml, fill in env values (or use .env), then:
#   mkdir -p ./data && sudo chown 1993:1993 ./data
#   docker compose up -d
# `sudo` because chowning to a different uid needs root. Do this before
# the first `up` — otherwise Compose creates ./data itself, owned by
# root, and the container (uid 1993 below, or your own uid if you add
# a `user:` line instead) can't write to it either way.

services:
  mig:
    image: antonshubin/mig:latest
    container_name: mig
    restart: unless-stopped
    ports:
      - "8080:8080"
    # The container runs as uid 1993 (see Dockerfile) — ./data must be
    # writable by that uid: `sudo chown 1993:1993 ./data` (see the note
    # above), or add a `user: "1000:1000"` line above with your own
    # uid:gid instead (only works if ./data already exists and you own
    # it, i.e. you ran the mkdir above yourself).
    volumes:
      - ./data:/data
    env_file:
      - .env
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget --spider -q http://localhost:8080/health || exit 1",
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
