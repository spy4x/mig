<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- mig's brand mark without the name: the BrandMark tile (32 px, the
       12 px card radius, mig's teal) holding @spy4x/preact-icons'
       IconCalendar at 20 px, in white. -->
  <rect width="32" height="32" rx="12" fill="#097463" />
  <g
    transform="translate(6 6) scale(0.8333)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
    <line x1="16" y1="2" x2="16" y2="6" />
    <line x1="8" y1="2" x2="8" y2="6" />
    <line x1="3" y1="10" x2="21" y2="10" />
  </g>
</svg>
